fragment AvailablePhoneNumber on AvailablePhoneNumber {
  phoneNumber
  countryCode
  numberType
  locality
  region
}

fragment PhoneNumberSearch on PhoneNumberSearch {
  id
  countryCode
  areaCode
  results {
    ...AvailablePhoneNumber
  }
  expiresAtEpochMs
  owner
  version
  createdAtEpochMs
  updatedAtEpochMs
}
